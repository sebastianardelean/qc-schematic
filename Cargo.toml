[workspace]
resolver = "2"
members = ["crates/qc-core", "crates/qc-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/sebastianardelean/qc-schematic"

[workspace.dependencies]
qc-core = { path = "crates/qc-core" }
regex = "1.13"

[profile.release]
lto = "thin"
